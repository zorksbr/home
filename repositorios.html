<!doctype html>

<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Repositórios</title>
  <link rel="icon" type="image/png" href="icons/siteicon.png">
  <script>
    if (sessionStorage.getItem('authenticated') !== 'true') {
      window.location.href = 'password.html';
    }
  </script>

  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', system-ui, sans-serif;
      text-align: center;
      color: #fff;
      position: relative;
      z-index: 1;
    }
    span {
      font-family: 'Arial', sans-serif;
      font-size: 25px;
      color: #fff;
      font-weight: bold;
    }
    header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    header img {
      width: 48px;
      height: auto;
    }
    header h1 {
      font-size: 28px;
      margin: 0;
      font-family: 'Press Start 2P', system-ui, sans-serif;
    }
    hr {
      border: none;
      border-top: 4px solid #fff;
      margin: 10px auto 20px;
      width: 90%;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 30px;
    }
    .sites {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      padding: 20px;
    }
    .site {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #fff;
    }
    .site img {
      width: 160px;
      height: auto;
      margin-bottom: 12px;
    }
    .site span {
      font-size: 14px;
    }
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    .fundo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: url('fundorep.png') no-repeat center center;
    background-size: cover;

    filter: blur(2.5px);
    transform: scale(1.1);
    z-index: -2;
    }
    .personagem {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 250px;
      height: 250px;
      z-index: -1;
    }
  </style>
</head>
<body>

  <div class="fundo"></div>
  
  <header>
    <h1>Aquilo que você estava procurando.</h1>
  </header>
  <hr>
  <h2>Repositórios do Drive</h2>
  <div class="sites">
    <a class="site" href="https://drive.google.com/drive/folders/1-8aZwNkkbZXmYAIaKs3HeAEg3R-3mAWF?usp=sharing" target="_blank" rel="noopener noreferrer">
      <img src="icons/drive.png" alt="Ícone Drive">
      <span>Drive do ZorksBR</span>
    </a>
    <a class="site" href="https://drive.google.com/drive/folders/1dpSE7kP-5U72h30GEWVZqhPvYsLBWxvH?usp=sharing" target="_blank" rel="noopener noreferrer">
      <img src="icons/drive.png" alt="Ícone Drive">
      <span>Drive do Henrique</span>
    </a>
  </div>
</body>
</html>
