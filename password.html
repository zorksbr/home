<!doctype html>

<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Senha</title>
  <link rel="icon" type="image/png" href="icons/siteicon.png">
  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', system-ui, sans-serif;
      text-align: center;
      color: #fff;
      position: relative;
      z-index: 1;
      background-color: #212121;
    }
    span {
      font-family: 'Arial', sans-serif;
      font-size: 25px;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>
<header>
  <h1>insira a senha.</h1>
  <span>Senha: <input type="password" id="passwordInput" placeholder="Digite a senha"></span>
  <button onclick="checkPassword()">Prossiga.</button>
  <audio id="audio" src="audio/proceed.mp3"></audio>
</header>
</body>
<script>
  function checkPassword() {
    const passwordInput = document.getElementById('passwordInput').value;
    const correctPassword = 'verdade';
    const sound = document.getElementById('audio');

    sound.currentTime = 0;
    sound.play().catch(error => {
      console.error('Erro ao reproduzir o áudio:', error);
    });

    if (passwordInput === correctPassword) {
        sessionStorage.setItem('authenticated', 'true');
        
      alert('Certo.');
      window.location.href = 'repositorios.html';
    } else {
      alert('Não.');
    }
  }
</script>
</html>
